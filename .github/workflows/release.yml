# Builds the installer and portable archive and drafts a GitHub release (D-85).
#
# Push a tag that matches the workspace version, e.g. `v0.1.0-alpha.1`. The workflow
# tests, builds, packages, and creates a *draft* release with generated notes and
# the files attached. Review the notes and press Publish; only published releases
# reach the in-app updater (D-84). A version with a `-` suffix is marked prerelease.
#
# Run it by hand (Actions > Release > Run workflow) to build the files without a
# release; they are kept as a workflow artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'hitsounds-rs').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match the workspace version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-'))".ToLower() >> $env:GITHUB_OUTPUT

      - name: Fetch ONNX Runtime (D-74)
        shell: pwsh
        run: ./tools/fetch-onnxruntime.ps1

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release -p hitsounds-rs --locked
        env:
          # Turns on the in-app updater for this repository (D-84).
          HITSOUNDS_RS_UPDATE_REPO: ${{ github.repository }}

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -Version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: hitsounds-rs-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            target/release/hitsounds_rs.pdb

      - name: Draft the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $flags = @('--draft', '--generate-notes', '--verify-tag', '--title', "hitsounds-rs $version")
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @flags `
            "dist/hitsounds-rs-$version-setup.exe" `
            "dist/hitsounds-rs-$version-portable.zip" `
            dist/SHA256SUMS.txt
