# Checks every push to main and every pull request, and builds a release from a
# version tag (D-85). One workflow, so a release always passes the same checks.
#
#   check    clippy and the tests, on every run.
#   release  only for a tag `v<version>` or a run by hand, and only once check has
#            passed. Builds the release, packages the installer and portable zip,
#            and for a tag creates a *draft* GitHub release with generated notes.
#            Review the notes and press Publish; only published releases reach the
#            in-app updater (D-84). A version with a `-` suffix is marked prerelease.
#
# Run it by hand (Actions > CI > Run workflow) to build the files without a
# release; they are kept as a workflow artifact.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to a branch cancels its older run. A release run is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch ONNX Runtime (D-74)
        shell: pwsh
        run: ./tools/fetch-onnxruntime.ps1
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'hitsounds-rs').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match the workspace version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-'))".ToLower() >> $env:GITHUB_OUTPUT

      - name: Fetch ONNX Runtime (D-74)
        shell: pwsh
        run: ./tools/fetch-onnxruntime.ps1

      - name: Build
        run: cargo build --release -p hitsounds-rs --locked
        env:
          # Turns on the in-app updater for this repository (D-84).
          HITSOUNDS_RS_UPDATE_REPO: ${{ github.repository }}

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -Version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: hitsounds-rs-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            target/release/hitsounds_rs.pdb

      - name: Draft the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $flags = @('--draft', '--generate-notes', '--verify-tag', '--title', "hitsounds-rs $version")
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @flags `
            "dist/hitsounds-rs-$version-setup.exe" `
            "dist/hitsounds-rs-$version-portable.zip" `
            dist/SHA256SUMS.txt
