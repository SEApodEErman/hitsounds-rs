[package]
name = "hitsounds-rs"
description = "hitsounds-rs, the Windows hitsounding editor (D-48, D-58)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(windows)'.dependencies]
dirs = "6"
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui-phosphor = "0.11"
hs-core.workspace = true
hs-export.workspace = true
hs-session.workspace = true
osu-format.workspace = true
raw-window-handle = "0.6"
rfd = { version = "0.16", default-features = false }
semver = "1"
serde.workspace = true
sha2 = "0.10.9"
similar = "2.7"
ureq = { version = "3.5", features = ["json"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Unpacks portable updates (D-84); only the deflate method the release archive uses.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dev-dependencies]
egui_kittest = "0.33.3"
tempfile.workspace = true

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }
